<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AnswerLens social preview</title>
  <desc id="desc">AnswerLens social preview with a report-first layout, prominent brand text, a visibility scorecard card, and a compact CLI proof panel.</desc>
  <defs>
    <linearGradient id="bg" x1="88" y1="56" x2="1194" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="0.54" stop-color="#0C1C33"/>
      <stop offset="1" stop-color="#132B4D"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(954 214) rotate(105) scale(326 488)">
      <stop stop-color="#1E6CFF" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#0D223B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="proofPanel" x1="72" y1="72" x2="432" y2="194" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152845" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0B182A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="scoreBar" x1="794" y1="0" x2="1138" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E8EFF"/>
      <stop offset="1" stop-color="#0B55D8"/>
    </linearGradient>
    <linearGradient id="lensStroke" x1="816" y1="122" x2="1104" y2="444" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FDBFF"/>
      <stop offset="1" stop-color="#2B82FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020B16" flood-opacity="0.36"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#83B9FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" rx="36" fill="#06111F"/>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="36" fill="url(#spotlight)"/>
  <rect width="1280" height="640" rx="36" fill="url(#grid)"/>

  <circle cx="1082" cy="104" r="154" fill="#3FD3FF" opacity="0.06"/>
  <circle cx="162" cy="560" r="188" fill="#9FFFE0" opacity="0.05"/>

  <g opacity="0.18">
    <circle cx="930" cy="296" r="168" stroke="url(#lensStroke)" stroke-opacity="0.22" stroke-width="8"/>
    <circle cx="930" cy="296" r="124" stroke="#A7E2FF" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="930" cy="296" r="74" stroke="#9FFFE0" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M1032 398L1102 468" stroke="#9FE8FF" stroke-opacity="0.16" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="360" height="126" rx="24" fill="url(#proofPanel)" stroke="#86B9FF" stroke-opacity="0.18"/>
    <circle cx="104" cy="102" r="6" fill="#FF6B6B"/>
    <circle cx="126" cy="102" r="6" fill="#FFD166"/>
    <circle cx="148" cy="102" r="6" fill="#58E6A7"/>
    <text x="102" y="138" fill="#8CF8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CLI proof</text>
    <text x="102" y="168" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22">$ answerlens audit</text>
    <text x="102" y="194" fill="#D7E8FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">scorecard.md   recommendations.md</text>
  </g>

  <text x="72" y="256" fill="#8FD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.08em">CI FOR AI DISCOVERABILITY</text>
  <text x="72" y="344" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="850" letter-spacing="-3">AnswerLens</text>
  <text x="72" y="390" fill="#CFE0F6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">AI visibility audits for product sites</text>
  <text x="72" y="442" fill="#9CB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Report-driven audits, scorecards, and actionable fixes</text>
  <text x="72" y="472" fill="#9CB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">you can review in GitHub.</text>
  <text x="72" y="540" fill="#9FFFE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">CLI-first &#183; BYOK &#183; Reproducible reports</text>

  <g filter="url(#shadow)">
    <rect x="760" y="82" width="446" height="440" rx="30" fill="#F7FBFF" stroke="#D6E6FF"/>
    <text x="794" y="128" fill="#2A74E8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="0.08em">PRIMARY ARTIFACT</text>
    <text x="794" y="168" fill="#071829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Visibility scorecard</text>
    <text x="794" y="198" fill="#607088" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">AI discoverability readiness</text>

    <text x="794" y="284" fill="#0B55D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="92" font-weight="850">90</text>
    <text x="914" y="284" fill="#516A83" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">/100</text>
    <rect x="794" y="302" width="344" height="16" rx="8" fill="#E5EDF8"/>
    <rect x="794" y="302" width="308" height="16" rx="8" fill="url(#scoreBar)"/>

    <rect x="794" y="344" width="126" height="32" rx="16" fill="#EEF4FF"/>
    <text x="818" y="365" fill="#1155CC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">SCORECARD</text>
    <rect x="932" y="344" width="170" height="32" rx="16" fill="#EAFBF7"/>
    <text x="956" y="365" fill="#097B5A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">RECOMMENDATIONS</text>

    <rect x="794" y="388" width="378" height="1" fill="#E5EDF8"/>
    <text x="794" y="420" fill="#627A92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">TOP FIX</text>
    <text x="794" y="452" fill="#071829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Thin key page</text>
    <text x="794" y="484" fill="#556E88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Add plain-language proof and</text>
    <text x="794" y="510" fill="#556E88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">stronger evidence blocks.</text>
  </g>
</svg>
