<svg width="1600" height="840" viewBox="0 0 1600 840" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AnswerLens README cover</title>
  <desc id="desc">AnswerLens hero art with a report-focused layout, a review packet card, a CLI proof card, and a subdued lens watermark.</desc>
  <defs>
    <linearGradient id="bg" x1="108" y1="78" x2="1500" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="0.55" stop-color="#0C1C33"/>
      <stop offset="1" stop-color="#132B4D"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1170 268) rotate(104) scale(420 640)">
      <stop stop-color="#1E6CFF" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#0D223B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="proofPanel" x1="120" y1="120" x2="580" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#152845" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0B182A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="scoreBar" x1="972" y1="0" x2="1392" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E8EFF"/>
      <stop offset="1" stop-color="#0B55D8"/>
    </linearGradient>
    <linearGradient id="lensStroke" x1="996" y1="166" x2="1352" y2="544" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FDBFF"/>
      <stop offset="1" stop-color="#2B82FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#020B16" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#83B9FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="840" rx="44" fill="#06111F"/>
  <rect width="1600" height="840" rx="44" fill="url(#bg)"/>
  <rect width="1600" height="840" rx="44" fill="url(#spotlight)"/>
  <rect width="1600" height="840" rx="44" fill="url(#grid)"/>

  <circle cx="1320" cy="132" r="182" fill="#3FD3FF" opacity="0.06"/>
  <circle cx="216" cy="748" r="248" fill="#9FFFE0" opacity="0.05"/>

  <g opacity="0.2">
    <circle cx="1166" cy="372" r="208" stroke="url(#lensStroke)" stroke-opacity="0.24" stroke-width="10"/>
    <circle cx="1166" cy="372" r="156" stroke="#A7E2FF" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="1166" cy="372" r="94" stroke="#9FFFE0" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M1288 494L1382 588" stroke="#9FE8FF" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>
    <path d="M1044 258C1090 228 1144 214 1202 214" stroke="#9FE8FF" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="120" width="460" height="228" rx="28" fill="url(#proofPanel)" stroke="#86B9FF" stroke-opacity="0.18"/>
    <circle cx="160" cy="156" r="7" fill="#FF6B6B"/>
    <circle cx="186" cy="156" r="7" fill="#FFD166"/>
    <circle cx="212" cy="156" r="7" fill="#58E6A7"/>
    <text x="156" y="204" fill="#8CF8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">CLI proof</text>
    <text x="156" y="242" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="26">$ answerlens audit</text>
    <text x="156" y="282" fill="#D7E8FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">share-summary.md</text>
    <text x="156" y="314" fill="#D7E8FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">scorecard.md</text>
    <text x="156" y="346" fill="#B7CDE7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21">recommendations.md</text>
  </g>

  <text x="120" y="404" fill="#8FD8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.08em">CI FOR AI DISCOVERABILITY</text>
  <text x="120" y="498" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="102" font-weight="850" letter-spacing="-3">AnswerLens</text>
  <text x="120" y="558" fill="#CFE0F6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="650">AI visibility audits for product sites</text>
  <text x="120" y="620" fill="#9CB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Report-driven audits, scorecards, and actionable fixes.</text>
  <text x="120" y="656" fill="#9CB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Built for teams who want outputs they can review in GitHub.</text>
  <text x="120" y="692" fill="#9CB8D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Show what AI can read, cite, compare, and recommend.</text>
  <text x="120" y="742" fill="#9FFFE0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">CLI-first &#183; BYOK &#183; Reproducible reports</text>

  <g filter="url(#shadow)">
    <rect x="930" y="108" width="540" height="580" rx="34" fill="#F7FBFF" stroke="#D6E6FF"/>
    <text x="972" y="164" fill="#2A74E8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="0.08em">SHAREABLE RUN</text>
    <text x="972" y="214" fill="#071829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Review packet</text>
    <text x="972" y="250" fill="#607088" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">A GitHub-native evidence bundle for a product site</text>

    <text x="972" y="366" fill="#0B55D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="108" font-weight="850">90</text>
    <text x="1112" y="366" fill="#516A83" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="600">/100</text>
    <rect x="972" y="392" width="420" height="18" rx="9" fill="#E5EDF8"/>
    <rect x="972" y="392" width="378" height="18" rx="9" fill="url(#scoreBar)"/>

    <rect x="972" y="440" width="132" height="36" rx="18" fill="#EEF4FF"/>
    <text x="1000" y="463" fill="#1155CC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">SUMMARY</text>
    <rect x="1118" y="440" width="146" height="36" rx="18" fill="#EAFBF7"/>
    <text x="1146" y="463" fill="#097B5A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">SCORECARD</text>
    <rect x="1278" y="440" width="132" height="36" rx="18" fill="#F1F6FF"/>
    <text x="1323" y="463" fill="#4161A8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">FIXES</text>

    <rect x="972" y="510" width="456" height="1" fill="#E5EDF8"/>
    <text x="972" y="558" fill="#627A92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.06em">READ FIRST</text>
    <text x="972" y="606" fill="#071829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Forwardable summary</text>
    <text x="972" y="644" fill="#556E88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Share the run, verify the scorecard, then turn</text>
    <text x="972" y="674" fill="#556E88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">recommendations into public source-material fixes.</text>
  </g>
</svg>
