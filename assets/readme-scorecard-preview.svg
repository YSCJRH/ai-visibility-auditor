<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Scorecard preview</title>
  <desc id="desc">AnswerLens scorecard preview showing audit scores, top issues, and recommendations from the static fixture run.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="1380" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="1" stop-color="#0F2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="180" x2="1160" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76C2FF"/>
      <stop offset="1" stop-color="#2E63FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020812" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="1188" cy="166" r="220" fill="#6ED6FF" fill-opacity="0.08"/>
  <circle cx="208" cy="742" r="260" fill="#91FFD7" fill-opacity="0.06"/>
  <path d="M120 188C276 132 456 132 660 196" stroke="#7DC8FF" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M906 132C1068 208 1188 326 1278 496" stroke="#91FFD7" stroke-opacity="0.12" stroke-width="2"/>

  <text x="120" y="116" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="760">Scorecard preview</text>
  <text x="120" y="160" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Static fixture audit output written by `corepack pnpm demo:fixture`</text>

  <g filter="url(#shadow)">
    <rect x="112" y="212" width="1216" height="592" rx="32" fill="#F8FBFF"/>
    <text x="164" y="284" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">AnswerLens scorecard</text>
    <text x="164" y="324" fill="#688099" font-family="Segoe UI, Arial, sans-serif" font-size="18">fixture.local / run kind: audit / pages crawled: 11</text>

    <text x="164" y="420" fill="#2E63FF" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800">78</text>
    <text x="292" y="420" fill="#58718A" font-family="Segoe UI, Arial, sans-serif" font-size="28">overall score</text>
    <rect x="164" y="450" width="384" height="18" rx="9" fill="#E5EDF8"/>
    <rect x="164" y="450" width="300" height="18" rx="9" fill="url(#accent)"/>
    <text x="164" y="506" fill="#58718A" font-family="Segoe UI, Arial, sans-serif" font-size="20">VAVR: pending eval</text>

    <g>
      <text x="652" y="286" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Readiness buckets</text>
      <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
        <text x="652" y="344" fill="#37506A">Access</text>
        <rect x="816" y="328" width="328" height="12" rx="6" fill="#E5EDF8"/>
        <rect x="816" y="328" width="328" height="12" rx="6" fill="#1AA87A"/>
        <text x="1174" y="344" fill="#0A1E35" font-weight="700">100</text>

        <text x="652" y="392" fill="#37506A">Structure</text>
        <rect x="816" y="376" width="328" height="12" rx="6" fill="#E5EDF8"/>
        <rect x="816" y="376" width="138" height="12" rx="6" fill="#2E63FF"/>
        <text x="1174" y="392" fill="#0A1E35" font-weight="700">42</text>

        <text x="652" y="440" fill="#37506A">Entity Clarity</text>
        <rect x="816" y="424" width="328" height="12" rx="6" fill="#E5EDF8"/>
        <rect x="816" y="424" width="328" height="12" rx="6" fill="#1AA87A"/>
        <text x="1174" y="440" fill="#0A1E35" font-weight="700">100</text>

        <text x="652" y="488" fill="#37506A">Evidence</text>
        <rect x="816" y="472" width="328" height="12" rx="6" fill="#E5EDF8"/>
        <rect x="816" y="472" width="233" height="12" rx="6" fill="#2E63FF"/>
        <text x="1174" y="488" fill="#0A1E35" font-weight="700">71</text>

        <text x="652" y="536" fill="#37506A">Comparative Readiness</text>
        <rect x="816" y="520" width="328" height="12" rx="6" fill="#E5EDF8"/>
        <rect x="816" y="520" width="253" height="12" rx="6" fill="#2E63FF"/>
        <text x="1174" y="536" fill="#0A1E35" font-weight="700">77</text>
      </g>
    </g>

    <g>
      <text x="164" y="586" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Top issues</text>
      <rect x="164" y="608" width="1060" height="1" fill="#E5EDF8"/>
      <text x="164" y="654" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">warn</text>
      <text x="246" y="654" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Thin key page</text>
      <text x="528" y="654" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">https://fixture.local/</text>
      <text x="842" y="654" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Add plain-language proof and stronger sections</text>

      <text x="164" y="700" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">warn</text>
      <text x="246" y="700" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Pricing page lacks citable detail</text>
      <text x="528" y="700" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">https://fixture.local/pricing</text>
      <text x="842" y="700" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Add ranges, packaging notes, and FAQ context</text>

      <text x="164" y="746" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">info</text>
      <text x="246" y="746" fill="#0A1E35" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">FAQ page lacks FAQ schema</text>
      <text x="528" y="746" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">https://fixture.local/faq</text>
      <text x="842" y="746" fill="#4D657E" font-family="Segoe UI, Arial, sans-serif" font-size="18">Mirror visible questions and answers in JSON-LD</text>
    </g>
  </g>
</svg>
