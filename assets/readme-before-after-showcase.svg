<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Before and after showcase</title>
  <desc id="desc">AnswerLens before and after showcase comparing vague AI SEO workflows to concrete audit, report, and launch-ready outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="112" y1="76" x2="1488" y2="824" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081426"/>
      <stop offset="1" stop-color="#102744"/>
    </linearGradient>
    <linearGradient id="beforePanel" x1="120" y1="228" x2="746" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B1520"/>
      <stop offset="1" stop-color="#1A1120"/>
    </linearGradient>
    <linearGradient id="afterPanel" x1="854" y1="228" x2="1480" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102841"/>
      <stop offset="1" stop-color="#0C1B30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="220" cy="150" r="180" fill="#FF7A7A" fill-opacity="0.08"/>
  <circle cx="1370" cy="756" r="220" fill="#74C6FF" fill-opacity="0.08"/>
  <path d="M800 176V772" stroke="#7FB4FF" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 14"/>

  <text x="120" y="112" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="760">Before / after showcase</text>
  <text x="120" y="156" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="24">How AnswerLens turns fuzzy AI visibility work into launch-ready artifacts and backlog</text>

  <g filter="url(#shadow)">
    <rect x="112" y="224" width="640" height="560" rx="32" fill="url(#beforePanel)" stroke="#FF9AA1" stroke-opacity="0.22"/>
    <text x="160" y="298" fill="#FFD3D8" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="760">Before</text>
    <text x="160" y="344" fill="#EAB6C0" font-family="Segoe UI, Arial, sans-serif" font-size="20">Vague visibility work with weak evidence and unclear ownership</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="22">
      <circle cx="174" cy="412" r="8" fill="#FF7A7A"/>
      <text x="198" y="420" fill="#FFF1F3">Thin pricing and security pages with little citable proof</text>
      <circle cx="174" cy="474" r="8" fill="#FF7A7A"/>
      <text x="198" y="482" fill="#FFF1F3">FAQ and compare pages missing schema or decision-ready context</text>
      <circle cx="174" cy="536" r="8" fill="#FF7A7A"/>
      <text x="198" y="544" fill="#FFF1F3">Manual answer samples mixed into generic eval metadata</text>
      <circle cx="174" cy="598" r="8" fill="#FF7A7A"/>
      <text x="198" y="606" fill="#FFF1F3">README talks about outputs, but visitors cannot see them fast</text>
      <circle cx="174" cy="660" r="8" fill="#FF7A7A"/>
      <text x="198" y="668" fill="#FFF1F3">Roadmap exists only as broad milestones, not execution-ready issues</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="848" y="224" width="640" height="560" rx="32" fill="url(#afterPanel)" stroke="#83D3FF" stroke-opacity="0.22"/>
    <text x="896" y="298" fill="#DDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="760">After</text>
    <text x="896" y="344" fill="#B8D7F0" font-family="Segoe UI, Arial, sans-serif" font-size="20">Concrete launch prep with shareable outputs, fixed metadata, and scoped backlog</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="22">
      <circle cx="910" cy="412" r="8" fill="#7BFFC9"/>
      <text x="934" y="420" fill="#F4FCFF">README shows a cover, scorecard preview, artifact preview, and showcase</text>
      <circle cx="910" cy="474" r="8" fill="#7BFFC9"/>
      <text x="934" y="482" fill="#F4FCFF">Scorecard HTML uses stable separators and shareable report wording</text>
      <circle cx="910" cy="536" r="8" fill="#7BFFC9"/>
      <text x="934" y="544" fill="#F4FCFF">`manual-import` writes `manual-import` into `run.mode` and `run.json.kind`</text>
      <circle cx="910" cy="598" r="8" fill="#7BFFC9"/>
      <text x="934" y="606" fill="#F4FCFF">Prompt pack ships with 35 prompts and 10 holdouts</text>
      <circle cx="910" cy="660" r="8" fill="#7BFFC9"/>
      <text x="934" y="668" fill="#F4FCFF">GitHub issues split v0.1, v0.2, and v0.3 into clear P0 and P1 work</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="392" width="504" height="116" rx="58" fill="#0C1E35" stroke="#7FB4FF" stroke-opacity="0.24"/>
    <text x="592" y="440" fill="#7BFFC9" font-family="Consolas, 'Courier New', monospace" font-size="24">audit -&gt; scorecard -&gt; recommendations -&gt; issues</text>
    <text x="642" y="476" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="20">No consumer UI scraping. No ranking promises. Clear next actions.</text>
  </g>
</svg>
