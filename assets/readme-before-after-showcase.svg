<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Before and after showcase</title>
  <desc id="desc">AnswerLens before and after showcase showing how vague AI visibility work becomes CI-ready reports, PR snippets, and focused backlog.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="64" x2="1520" y2="836" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071322"/>
      <stop offset="0.58" stop-color="#0D2038"/>
      <stop offset="1" stop-color="#102B48"/>
    </linearGradient>
    <linearGradient id="beforePanel" x1="112" y1="232" x2="742" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C1722"/>
      <stop offset="1" stop-color="#18101C"/>
    </linearGradient>
    <linearGradient id="afterPanel" x1="858" y1="232" x2="1488" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B43"/>
      <stop offset="1" stop-color="#091B2F"/>
    </linearGradient>
    <linearGradient id="loopRibbon" x1="132" y1="744" x2="1468" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1B30"/>
      <stop offset="0.5" stop-color="#102E4A"/>
      <stop offset="1" stop-color="#0C1F35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020914" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.37 0 0 0 0 0.77 0 0 0 0 1 0 0 0 0.44 0"/>
      <feBlend in2="SourceGraphic" mode="screen"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L11 7L2 12" stroke="#7BFFC9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <circle cx="210" cy="126" r="190" fill="#FF7A7A" fill-opacity="0.07"/>
  <circle cx="1382" cy="760" r="230" fill="#74C6FF" fill-opacity="0.08"/>
  <path d="M120 188H1480" stroke="#8BB9FF" stroke-opacity="0.12"/>
  <path d="M800 214V706" stroke="#7FB4FF" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="10 14"/>

  <text x="112" y="108" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="760">Before / after showcase</text>
  <text x="112" y="150" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="23">
    <tspan x="112" dy="0">How AnswerLens turns fuzzy AI visibility work into</tspan>
    <tspan x="112" dy="31">repo-native reports, PR snippets, and focused backlog.</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="112" y="232" width="630" height="474" rx="32" fill="url(#beforePanel)" stroke="#FF9AA1" stroke-opacity="0.24"/>
    <rect x="144" y="264" width="114" height="42" rx="21" fill="#FF7A7A" fill-opacity="0.12" stroke="#FF9AA1" stroke-opacity="0.24"/>
    <text x="166" y="293" fill="#FFD3D8" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="760">Before</text>
    <text x="144" y="345" fill="#F1B8C2" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">
      <tspan x="144" dy="0">Vague AI visibility work</tspan>
      <tspan x="144" dy="30">with weak evidence.</tspan>
    </text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="520">
      <circle cx="160" cy="420" r="8" fill="#FF7A7A"/>
      <text x="186" y="428" fill="#FFF1F3">Vague AI SEO work</text>

      <circle cx="160" cy="494" r="8" fill="#FF7A7A"/>
      <text x="186" y="502" fill="#FFF1F3">Thin pricing and security proof</text>

      <circle cx="160" cy="568" r="8" fill="#FF7A7A"/>
      <text x="186" y="552" fill="#FFF1F3">
        <tspan x="186" dy="0">FAQ and compare pages lack</tspan>
        <tspan x="186" dy="28">decision-ready context</tspan>
      </text>

      <circle cx="160" cy="642" r="8" fill="#FF7A7A"/>
      <text x="186" y="626" fill="#FFF1F3">
        <tspan x="186" dy="0">Reports are hard to paste</tspan>
        <tspan x="186" dy="28">into PRs and releases</tspan>
      </text>
    </g>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="800" cy="470" r="44" fill="#0D263F" stroke="#7BFFC9" stroke-opacity="0.44" stroke-width="2"/>
    <path d="M762 470H838" stroke="#7BFFC9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="800" y="530" text-anchor="middle" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="232" width="630" height="474" rx="32" fill="url(#afterPanel)" stroke="#83D3FF" stroke-opacity="0.24"/>
    <rect x="890" y="264" width="96" height="42" rx="21" fill="#7BFFC9" fill-opacity="0.12" stroke="#7BFFC9" stroke-opacity="0.26"/>
    <text x="913" y="293" fill="#DDF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="760">After</text>
    <text x="890" y="345" fill="#B8D7F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="650">
      <tspan x="890" dy="0">CI for AI discoverability</tspan>
      <tspan x="890" dy="30">with shareable outputs.</tspan>
    </text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="520">
      <circle cx="906" cy="420" r="8" fill="#7BFFC9"/>
      <text x="932" y="428" fill="#F4FCFF">share-summary.md and pr-snippet.md</text>

      <circle cx="906" cy="494" r="8" fill="#7BFFC9"/>
      <text x="932" y="478" fill="#F4FCFF">
        <tspan x="932" dy="0">Scorecards, recommendations,</tspan>
        <tspan x="932" dy="28">and artifact links</tspan>
      </text>

      <circle cx="906" cy="568" r="8" fill="#7BFFC9"/>
      <text x="932" y="552" fill="#F4FCFF">
        <tspan x="932" dy="0">P0/P1 GitHub issues mapped</tspan>
        <tspan x="932" dy="28">to release milestones</tspan>
      </text>

      <circle cx="906" cy="642" r="8" fill="#7BFFC9"/>
      <text x="932" y="626" fill="#F4FCFF">
        <tspan x="932" dy="0">No UI scraping.</tspan>
        <tspan x="932" dy="28">No ranking promises.</tspan>
      </text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="132" y="744" width="1336" height="96" rx="30" fill="url(#loopRibbon)" stroke="#7FB4FF" stroke-opacity="0.2"/>
    <text x="168" y="785" fill="#7BFFC9" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="760" letter-spacing="0.08em">PROPAGATION LOOP</text>
    <text x="168" y="817" fill="#D8E9FF" font-family="Consolas, 'Courier New', monospace" font-size="23">
      audit -&gt; share summary -&gt; PR review -&gt; fixes -&gt; teardown
    </text>
    <rect x="1110" y="772" width="304" height="42" rx="21" fill="#071322" fill-opacity="0.58" stroke="#7BFFC9" stroke-opacity="0.2"/>
    <text x="1262" y="800" text-anchor="middle" fill="#BBD5F0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650">report-first, repo-native</text>
  </g>
</svg>
