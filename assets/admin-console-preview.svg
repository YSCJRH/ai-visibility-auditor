<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1240" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16031F"/>
      <stop offset="0.52" stop-color="#0B0422"/>
      <stop offset="1" stop-color="#070014"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#171434"/>
      <stop offset="1" stop-color="#0D0B22"/>
