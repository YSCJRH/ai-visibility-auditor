  <rect x="0" y="0" width="286" height="900" fill="#0A0B12" fill-opacity="0.84"/>
  <rect x="286" y="0" width="1" height="900" fill="rgba(255,255,255,0.06)"/>

  <text x="28" y="46" fill="rgba(237,236,239,0.62)" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.8">INTERNAL CONTROL CONSOLE</text>
  <text x="28" y="102" fill="#EDECEF" font-size="58" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.6">AnswerLens</text>
  <text x="28" y="152" fill="#EDECEF" font-size="58" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.6">Admin</text>
  <text x="28" y="204" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">Artifact-first review, run orchestration,</text>
  <text x="28" y="232" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">and repo-native presets without a dashboard rewrite.</text>

  <rect x="20" y="296" width="230" height="62" rx="14" fill="rgba(94,106,210,0.14)" stroke="rgba(94,106,210,0.32)"/>
  <text x="40" y="335" fill="#EDECEF" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Runs</text>

  <rect x="20" y="374" width="230" height="62" rx="14" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.06)"/>
  <text x="40" y="413" fill="#8D939D" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Presets</text>

  <rect x="20" y="470" width="230" height="168" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="40" y="510" fill="rgba(237,236,239,0.62)" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.8">OPERATOR PATH</text>
  <text x="40" y="550" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">Choose a preset path, launch a run,</text>
  <text x="40" y="578" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">then review summary → scorecard →</text>
  <text x="40" y="606" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">recommendations in order.</text>

  <rect x="320" y="24" width="1088" height="126" rx="22" fill="rgba(10,10,12,0.84)" stroke="rgba(255,255,255,0.06)" filter="url(#shadow)"/>
  <text x="350" y="64" fill="#EDECEF" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-1.1">Runs workspace</text>
  <text x="350" y="101" fill="#8D939D" font-size="19" font-family="Inter, Arial, sans-serif">Choose the next run worth opening, then move into artifact-backed review instead of scanning the whole workspace equally.</text>
  <text x="1158" y="67" fill="rgba(237,236,239,0.62)" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">LANGUAGE</text>
  <rect x="1126" y="84" width="114" height="46" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
