  <rect x="1258" y="70" width="120" height="56" rx="14" fill="url(#primary)"/>
  <text x="1286" y="105" fill="white" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Launch run</text>

  <text x="320" y="190" fill="rgba(237,236,239,0.62)" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.8">RUNS WORKSPACE</text>
  <text x="320" y="254" fill="#EDECEF" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-3.2">Review the latest</text>
  <text x="320" y="322" fill="#EDECEF" font-size="68" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-3.2">file-backed runs</text>
  <text x="320" y="370" fill="#8D939D" font-size="22" font-family="Inter, Arial, sans-serif">The admin surface starts from completed artifacts, not charts.</text>

  <g filter="url(#shadow)">
    <rect x="320" y="408" width="252" height="156" rx="18" fill="rgba(10,10,12,0.84)" stroke="rgba(255,255,255,0.06)"/>
