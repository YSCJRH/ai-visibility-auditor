  <text x="802" y="706" fill="#EDECEF" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="600">static-good</text>
  <text x="1018" y="706" fill="#EDECEF" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">AnswerLens static-good fixture demo</text>
  <text x="802" y="736" fill="#8D939D" font-size="17" font-family="Inter, Arial, sans-serif">Audit</text>
  <text x="954" y="736" fill="#EDECEF" font-size="17" font-family="Inter, Arial, sans-serif">90/100</text>
  <rect x="1096" y="716" width="124" height="34" rx="999" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="1118" cy="733" r="5" fill="#6BD0B4"/>
  <text x="1132" y="739" fill="#6BD0B4" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">COMPLETED</text>
  <text x="802" y="776" fill="#8D939D" font-size="17" font-family="Inter, Arial, sans-serif">./examples/fixtures/static-good</text>
  <line x1="802" y1="790" x2="1348" y2="790" stroke="rgba(255,255,255,0.08)"/>

  <text x="802" y="826" fill="#6872D9" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">share-summary.md</text>
  <text x="968" y="826" fill="#8D939D" font-size="16" font-family="Inter, Arial, sans-serif">→</text>
  <text x="996" y="826" fill="#6872D9" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">scorecard.md</text>
  <text x="1132" y="826" fill="#8D939D" font-size="16" font-family="Inter, Arial, sans-serif">→</text>
  <text x="1160" y="826" fill="#6872D9" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">recommendations.md</text>
