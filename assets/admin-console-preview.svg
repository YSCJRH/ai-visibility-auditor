    <text x="614" y="446" fill="rgba(237,236,239,0.62)" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">AVERAGE SCORE</text>
    <text x="614" y="514" fill="#6872D9" font-size="60" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.4">88/100</text>
    <text x="614" y="548" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">A quick pulse across the local run history.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="856" y="408" width="252" height="156" rx="18" fill="rgba(10,10,12,0.84)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="856" y="408" width="252" height="2" fill="rgba(199,210,254,0.9)"/>
    <text x="882" y="446" fill="rgba(237,236,239,0.62)" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">LATEST RUN</text>
    <text x="882" y="514" fill="#6BD0B4" font-size="60" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.4">90/100</text>
    <text x="882" y="548" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">AnswerLens static-good fixture demo.</text>
  </g>

