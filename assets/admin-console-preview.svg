    <text x="346" y="446" fill="rgba(237,236,239,0.62)" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">TOTAL RUNS</text>
    <text x="346" y="514" fill="#EDECEF" font-size="60" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.4">7</text>
    <text x="346" y="548" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">Artifacts currently readable from `runs/*`.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="588" y="408" width="252" height="156" rx="18" fill="rgba(10,10,12,0.84)" stroke="rgba(255,255,255,0.06)"/>
