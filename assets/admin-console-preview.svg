  <text x="384" y="770" fill="#FFFFFF" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">Open run detail</text>

  <rect x="772" y="630" width="608" height="178" rx="18" fill="rgba(255,255,255,0.028)" stroke="rgba(255,255,255,0.05)"/>
