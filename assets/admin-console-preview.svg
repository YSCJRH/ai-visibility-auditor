<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="240" y1="40" x2="1180" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2037"/>
      <stop offset="0.45" stop-color="#0B0D18"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 110) rotate(90) scale(340 620)">
      <stop stop-color="#5E6AD2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 520) rotate(90) scale(260 360)">
      <stop stop-color="#6E58D8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6E58D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6872D9"/>
      <stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

