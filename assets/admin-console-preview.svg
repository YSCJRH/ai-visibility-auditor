    <rect x="1124" y="408" width="284" height="2" fill="rgba(199,210,254,0.9)"/>
    <text x="1150" y="446" fill="rgba(237,236,239,0.62)" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1.5">RUN MIX</text>
    <text x="1150" y="514" fill="#EDECEF" font-size="60" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="-2.4">5:0</text>
    <text x="1150" y="548" fill="#8D939D" font-size="18" font-family="Inter, Arial, sans-serif">Audit to eval count in the local workspace.</text>
