name: "AnswerLens"
description: "Run AnswerLens audit, eval, manual-import, validation import, or helper workflows in GitHub Actions."

inputs:
  command:
    description: "One of audit, eval, manual-import, search-console-import, or bing-indexnow-helper."
    required: true
  site:
    description: "Public URL or local fixture path."
    required: true
  brand:
    description: "Path to brand.yaml."
    required: true
  competitors:
    description: "Path to competitors.yaml."
    required: true
  prompts:
    description: "Path to prompts.yaml."
    required: true
  out-dir:
    description: "Output directory for AnswerLens artifacts."
    required: false
    default: "runs/answerlens"
  runtime:
    description: "Optional path to runtime.yaml for eval defaults. Defaults to a sibling runtime.yaml next to brand.yaml."
    required: false
  provider:
    description: "Optional eval provider override."
    required: false
  model:
    description: "Optional provider model override."
    required: false
  samples:
    description: "Repeated samples for eval runs."
    required: false
    default: "1"
  locale:
    description: "Optional locale override."
    required: false
  timeout-ms:
    description: "Optional eval provider timeout override in milliseconds."
    required: false
  base-url:
    description: "Optional eval provider base URL override."
    required: false
  manual-input:
    description: "Path to normalized manual-import JSON."
    required: false
  bing-input:
    description: "Path to page-level Bing Webmaster CSV export."
    required: false
  node-version:
    description: "Node.js version used by the Action."
    required: false
    default: "22"
  pnpm-version:
    description: "pnpm version used by the Action."
    required: false
    default: "10.33.0"

outputs:
  out-dir:
    description: "Absolute output directory for generated artifacts."
    value: ${{ steps.run-answerlens.outputs.out_dir }}
  share-summary-path:
    description: "Absolute path to share-summary.md."
    value: ${{ steps.run-answerlens.outputs.share_summary_path }}
  scorecard-path:
    description: "Absolute path to scorecard.md."
    value: ${{ steps.run-answerlens.outputs.scorecard_path }}
  recommendations-path:
    description: "Absolute path to recommendations.md."
    value: ${{ steps.run-answerlens.outputs.recommendations_path }}
  pr-snippet-path:
    description: "Absolute path to pr-snippet.md."
    value: ${{ steps.run-answerlens.outputs.pr_snippet_path }}
  run-json-path:
    description: "Absolute path to run.json."
    value: ${{ steps.run-answerlens.outputs.run_json_path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v5
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: Prepare pnpm via corepack
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        corepack enable
        corepack prepare "pnpm@${{ inputs.pnpm-version }}" --activate
        pnpm --version
    - name: Install AnswerLens dependencies
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        Set-Location '${{ github.action_path }}'
        pnpm install --frozen-lockfile
    - name: Build AnswerLens CLI
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        Set-Location '${{ github.action_path }}'
        pnpm build:cli
    - name: Run AnswerLens
      id: run-answerlens
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest

        function Resolve-AnswerLensInput([string]$Value) {
          if ([string]::IsNullOrWhiteSpace($Value)) {
            return $null
          }

          if ($Value -match '^(https?://)') {
            return $Value
          }

          if ([System.IO.Path]::IsPathRooted($Value)) {
            return $Value
          }

          return [System.IO.Path]::GetFullPath((Join-Path '${{ github.workspace }}' $Value))
        }

        $command = '${{ inputs.command }}'
        if ($command -notin @('audit', 'eval', 'manual-import', 'search-console-import', 'bing-indexnow-helper')) {
          throw "Unsupported command '$command'. Use audit, eval, manual-import, search-console-import, or bing-indexnow-helper."
        }

        if ($command -eq 'manual-import' -and [string]::IsNullOrWhiteSpace('${{ inputs.manual-input }}')) {
          throw 'Input "manual-input" is required for manual-import runs.'
        }

        if ($command -eq 'bing-indexnow-helper' -and [string]::IsNullOrWhiteSpace('${{ inputs.bing-input }}')) {
          throw 'Input "bing-input" is required for bing-indexnow-helper runs.'
        }

        $outInput = '${{ inputs.out-dir }}'
        $outDir = if ([System.IO.Path]::IsPathRooted($outInput)) {
          $outInput
        } else {
          [System.IO.Path]::GetFullPath((Join-Path '${{ github.workspace }}' $outInput))
        }

        $args = @(
          (Join-Path '${{ github.action_path }}' 'apps/cli/dist/index.js'),
          $command,
          (Resolve-AnswerLensInput '${{ inputs.site }}'),
          '--brand',
          (Resolve-AnswerLensInput '${{ inputs.brand }}'),
          '--competitors',
          (Resolve-AnswerLensInput '${{ inputs.competitors }}'),
          '--prompts',
          (Resolve-AnswerLensInput '${{ inputs.prompts }}'),
          '--out',
          $outDir
        )

        if ($command -eq 'eval') {
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.runtime }}')) {
            $args += @('--runtime', (Resolve-AnswerLensInput '${{ inputs.runtime }}'))
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.provider }}')) {
            $args += @('--provider', '${{ inputs.provider }}')
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.model }}')) {
            $args += @('--model', '${{ inputs.model }}')
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.samples }}')) {
            $args += @('--samples', '${{ inputs.samples }}')
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.timeout-ms }}')) {
            $args += @('--timeout-ms', '${{ inputs.timeout-ms }}')
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.base-url }}')) {
            $args += @('--base-url', '${{ inputs.base-url }}')
          }
        }

        if (-not [string]::IsNullOrWhiteSpace('${{ inputs.locale }}')) {
          $args += @('--locale', '${{ inputs.locale }}')
        }

        if ($command -eq 'manual-import') {
          $args += @('--input', (Resolve-AnswerLensInput '${{ inputs.manual-input }}'))
        }

        if ($command -eq 'bing-indexnow-helper') {
          $args += @('--bing-input', (Resolve-AnswerLensInput '${{ inputs.bing-input }}'))
        }

        & node @args

        "out_dir=$outDir" >> $env:GITHUB_OUTPUT
        "share_summary_path=$([System.IO.Path]::GetFullPath((Join-Path $outDir 'share-summary.md')))" >> $env:GITHUB_OUTPUT
        "scorecard_path=$([System.IO.Path]::GetFullPath((Join-Path $outDir 'scorecard.md')))" >> $env:GITHUB_OUTPUT
        "recommendations_path=$([System.IO.Path]::GetFullPath((Join-Path $outDir 'recommendations.md')))" >> $env:GITHUB_OUTPUT
        "pr_snippet_path=$([System.IO.Path]::GetFullPath((Join-Path $outDir 'pr-snippet.md')))" >> $env:GITHUB_OUTPUT
        "run_json_path=$([System.IO.Path]::GetFullPath((Join-Path $outDir 'run.json')))" >> $env:GITHUB_OUTPUT
