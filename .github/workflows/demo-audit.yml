name: Demo Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/**'
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/demo-audit.yml'

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:fixture
      - name: Summarize demo outputs
        run: |
          {
            echo '## AnswerLens demo audit'
            echo ''
            echo '- Fixture: static-good'
            echo '- Output directory: runs/static-good'
            echo '- Generated artifacts:'
            echo '  - site-audit.json'
            echo '  - issues.json'
            echo '  - recommendations.md'
            echo '  - scorecard.md'
            echo '  - index.html'
            echo '  - normalized-pages.json'
            echo '  - competitor-diff.md'
            echo '  - run.json'
            echo ''
            echo '### Scorecard excerpt'
            sed -n '1,25p' runs/static-good/scorecard.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: answerlens-demo-audit
          path: runs/static-good
