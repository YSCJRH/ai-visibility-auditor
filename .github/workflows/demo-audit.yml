name: Demo Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/**'
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/demo-audit.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: answerlens
        uses: ./
        with:
          command: audit
          site: examples/fixtures/static-good
          brand: examples/acme/brand.yaml
          competitors: examples/acme/competitors.yaml
          prompts: examples/acme/prompts.yaml
          out-dir: runs/static-good
      - name: Summarize demo outputs
        run: |
          {
            echo '## AnswerLens demo audit'
            echo ''
            cat "${{ steps.answerlens.outputs.share-summary-path }}"
            echo ''
            echo '### PR-ready snippet'
            cat "${{ steps.answerlens.outputs.pr-snippet-path }}"
            echo ''
            echo '### Artifact tree'
            find "${{ steps.answerlens.outputs.out-dir }}" -maxdepth 2 -type f | sort
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: answerlens-demo-audit
          path: ${{ steps.answerlens.outputs.out-dir }}
