name: Release Distribution

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Optional semver tag to simulate or publish, for example v0.3.2."
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_NPM_TRUSTED_PUBLISH: ${{ vars.ANSWERLENS_ENABLE_NPM_TRUSTED_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.tag-name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag-name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          fi
      - name: Validate CLI version matches tag
        if: ${{ env.RELEASE_TAG != '' }}
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('apps/cli/package.json','utf8')); const tag=(process.env.RELEASE_TAG||'').replace(/^v/, ''); if (pkg.version !== tag) { console.error(`apps/cli/package.json version ${pkg.version} does not match tag ${tag}`); process.exit(1); }"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm public:check
      - run: pnpm demo:fixture
      - run: pnpm demo:consumer-repo
      - run: pnpm build:cli
      - run: pnpm pack:cli
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            fs.mkdirSync("dist", { recursive: true });
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const compiled = releases.map((release) => ({
              tag_name: release.tag_name,
              name: release.name,
              html_url: release.html_url,
              published_at: release.published_at,
              body: release.body,
              draft: release.draft,
              prerelease: release.prerelease
            }));
            fs.writeFileSync("dist/releases.json", `${JSON.stringify(compiled, null, 2)}\n`);
      - run: pnpm build:site -- --releases dist/releases.json
      - run: pnpm seo:check --releases dist/releases.json
      - name: Create release bundles
        run: |
          tar -czf dist/answerlens-demo-audit.tar.gz runs/static-good
          tar -czf dist/answerlens-site.tar.gz dist/site
      - name: Write release notes
        run: |
          cat <<'EOF' > dist/release-notes.md
          AnswerLens is a CLI-first AI visibility auditor for product websites.

          CI for AI discoverability.

          ## Start here

          - Open the live demo report: https://yscjrh.github.io/ai-visibility-auditor/examples/static-good/index.html
          - Run the 60-second fixture demo: https://github.com/YSCJRH/ai-visibility-auditor#run-the-60-second-fixture-demo
          - Run a 5-minute real-site audit: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/quickstart.md
          - Add the GitHub Action: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/github-action.md
          - Download assets from this release: CLI tarball, demo audit bundle, and compiled site bundle

          ## What ships

          - Bilingual public Pages routing under `/en/` and `/zh/` with a visible language switcher
          - `README.zh-CN.md` plus `docs/zh/` mirrors for the first-run path and admin guide
          - Localized human-readable report outputs such as `share-summary.zh.md`, `scorecard.zh.md`, `recommendations.zh.md`, and `index.zh.html`
          - Admin SPA and `/review/*` language switching with saved preference or query-based locale selection
          - More natural Chinese `compare`, `starter`, and `examples` pages that keep the demo-to-CI funnel intact
          - Publish-ready CLI bundle and tarball plus repo-native report artifacts

          ## Known limits

          - No consumer AI UI scraping
          - No ranking guarantees
          - JSON contracts and machine-readable fields remain English-stable; localization only applies to human-readable surfaces
          - The admin console is an internal operator surface, not a public SaaS or canonical product front door
          - GitHub Pages deployment still depends on repository settings
          - npm publish is skipped unless NPM_TOKEN or trusted publishing is configured

          ## Canonical docs

          - README: https://github.com/YSCJRH/ai-visibility-auditor#readme
          - Chinese README: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/README.zh-CN.md
          - GitHub-native growth plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/github-growth-plan.md
          - Distribution plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/distribution-plan.md
          - Manual steps: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/manual-steps.md
          - Quickstart: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/quickstart.md
          - Activation plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/activation-plan.md
          - Admin console guide: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/admin-console.md

          ## Current follow-through

          - Current umbrella issue: https://github.com/YSCJRH/ai-visibility-auditor/issues/33
          EOF
      - name: Create or update GitHub release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          fi
      - name: Publish to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' && env.RELEASE_TAG != '' }}
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Publish to npm with trusted publishing
        if: ${{ env.HAS_NPM_TOKEN != 'true' && env.HAS_NPM_TRUSTED_PUBLISH == 'true' && env.RELEASE_TAG != '' }}
        working-directory: apps/cli
        run: npm publish --provenance --access public
      - name: Note skipped npm publish
        if: ${{ (env.HAS_NPM_TOKEN != 'true' && env.HAS_NPM_TRUSTED_PUBLISH != 'true') || env.RELEASE_TAG == '' }}
        run: |
          {
            echo "## npm publish skipped"
            echo ""
            echo "Either no semver release tag was provided, or neither NPM_TOKEN nor trusted publishing is enabled, so the workflow only produced tarballs and release artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assets to GitHub release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/packages/*.tgz dist/answerlens-demo-audit.tar.gz dist/answerlens-site.tar.gz --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: answerlens-release-distribution
          path: |
            dist/packages
            dist/answerlens-demo-audit.tar.gz
            dist/answerlens-site.tar.gz
            dist/site
