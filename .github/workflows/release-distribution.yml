name: Release Distribution

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "Optional semver tag to simulate or publish, for example v0.3.5."
        required: false
        type: string
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_NPM_TRUSTED_PUBLISH: ${{ vars.ANSWERLENS_ENABLE_NPM_TRUSTED_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.tag-name }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag-name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=" >> "$GITHUB_ENV"
          fi
      - name: Validate CLI version matches tag
        if: ${{ env.RELEASE_TAG != '' }}
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('apps/cli/package.json','utf8')); const tag=(process.env.RELEASE_TAG||'').replace(/^v/, ''); if (pkg.version !== tag) { console.error(`apps/cli/package.json version ${pkg.version} does not match tag ${tag}`); process.exit(1); }"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm public:check
      - run: pnpm demo:fixture
      - run: pnpm demo:consumer-repo
      - run: pnpm build:cli
      - run: pnpm pack:cli
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            fs.mkdirSync("dist", { recursive: true });
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const compiled = releases.map((release) => ({
              tag_name: release.tag_name,
              name: release.name,
              html_url: release.html_url,
              published_at: release.published_at,
              body: release.body,
              draft: release.draft,
              prerelease: release.prerelease
            }));
            const releaseTag = process.env.RELEASE_TAG;
            if (releaseTag && !compiled.some((release) => release.tag_name === releaseTag)) {
              compiled.unshift({
                tag_name: releaseTag,
                name: releaseTag,
                html_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${releaseTag}`,
                published_at: new Date().toISOString(),
                body: "",
                draft: false,
                prerelease: false
              });
            }
            fs.writeFileSync("dist/releases.json", `${JSON.stringify(compiled, null, 2)}\n`);
      - run: pnpm build:site -- --releases dist/releases.json
      - run: pnpm seo:check --releases dist/releases.json
      - name: Create release bundles
        run: |
          tar -czf dist/answerlens-demo-audit.tar.gz runs/static-good
          tar -czf dist/answerlens-site.tar.gz dist/site
      - name: Write release asset manifest
        run: |
          pnpm release:assets:manifest -- --out dist/release-assets-manifest.json dist/packages/*.tgz dist/answerlens-demo-audit.tar.gz dist/answerlens-site.tar.gz
          pnpm release:assets:manifest -- --verify dist/release-assets-manifest.json --summary-out dist/release-assets-summary.md
          cat dist/release-assets-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke check release assets
        run: |
          pnpm release:assets:smoke -- --dir dist --work-dir dist/release-assets-smoke-check --summary-out dist/release-assets-smoke-summary.md
          cat dist/release-assets-smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write release notes
        run: |
          cat <<'EOF' > dist/release-notes.md
          AnswerLens is a CLI-first AI visibility auditor for product websites.

          CI for AI discoverability.

          ## Start here

          - Open the live demo report: https://yscjrh.github.io/ai-visibility-auditor/examples/static-good/index.html
          - Run the 60-second fixture demo: https://github.com/YSCJRH/ai-visibility-auditor#run-the-60-second-fixture-demo
          - Run a 5-minute real-site audit: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/quickstart.md
          - Add the GitHub Action: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/github-action.md
          - Download assets from this release: CLI tarball, demo audit bundle, and compiled site bundle

          ## Release asset checklist

          - CLI tarball: use the versioned `answerlens-cli-*.tgz` package for pinned local CLI runs before npm is visible
          - `answerlens-demo-audit.tar.gz`: unpack the fixture report and open `share-summary.md`, then `scorecard.md`, then `recommendations.md`
          - The Release Distribution workflow runs `pnpm release:assets:smoke -- --dir dist` before uploading release assets
          - `answerlens-site.tar.gz`: inspect the compiled Pages bundle for docs, examples, starter, and release pages at this tag
          - `release-assets-manifest.json`: verify asset sizes and SHA-256 checksums before reusing downloaded release assets
          - `release-assets-summary.md`: read the verified asset table before forwarding or reusing downloaded release assets
          - If `npm view @answerlens/cli` returns `404`, keep release assets or local checkout as the public path; do not present npm as activated

          ## What ships

          - Release assets rebuilt from the current `main` state after the post-deploy Pages category polish
          - Compiled site bundle aligned with the live Pages category schema and public product description
          - Self-dogfood log, roadmap, release snapshot, and GitHub bootstrap copy synced after the postdeploy dogfood pass
          - Starter bundle and GitHub Action docs pinned to the reviewed `v0.3.5` Action release
          - The same fixture demo, consumer-repo demo, public-claim checks, typecheck, tests, and SEO checks as the release gate
          - Publish-ready CLI bundle and tarball plus repo-native report artifacts

          ## Known limits

          - No consumer AI UI scraping
          - No ranking guarantees
          - No promise of answer placement in ChatGPT, Perplexity, AI Overview, or any answer surface
          - Readiness and VAVR are diagnostic signals, not platform rankings
          - Optional `eval` is BYOK; secrets stay in environment variables or GitHub secrets, not `runtime.yaml`
          - Public summaries and default GitHub artifacts should not expose raw provider payloads
          - The Codex plugin is a maintainer workflow helper, not a new audit engine or public SaaS surface
          - GitHub Pages deployment still depends on repository settings
          - npm publish is skipped unless NPM_TOKEN or trusted publishing is configured

          ## Canonical docs

          - README: https://github.com/YSCJRH/ai-visibility-auditor#readme
          - Chinese README: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/README.zh-CN.md
          - GitHub-native growth plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/github-growth-plan.md
          - Distribution plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/distribution-plan.md
          - Manual steps: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/manual-steps.md
          - Quickstart: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/quickstart.md
          - Activation plan: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/activation-plan.md
          - Trust and safety: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/trust-and-safety.md
          - First-run story: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/first-run-story.md
          - Codex plugin: https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/codex-plugin.md

          ## Follow-through

          - Track public-source self-dogfooding loops in https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/self-dogfood-log.md
          - Share safe first-run artifacts through https://github.com/YSCJRH/ai-visibility-auditor/discussions/new?category=show-and-tell
          - Open focused issues only when a concrete repo-editable gap remains
          EOF
      - name: Create or update GitHub release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          fi
      - name: Publish to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' && env.RELEASE_TAG != '' }}
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
      - name: Publish to npm with trusted publishing
        if: ${{ env.HAS_NPM_TOKEN != 'true' && env.HAS_NPM_TRUSTED_PUBLISH == 'true' && env.RELEASE_TAG != '' }}
        working-directory: apps/cli
        run: npm publish --provenance --access public
      - name: Note skipped npm publish
        if: ${{ (env.HAS_NPM_TOKEN != 'true' && env.HAS_NPM_TRUSTED_PUBLISH != 'true') || env.RELEASE_TAG == '' }}
        run: |
          {
            echo "## npm publish skipped"
            echo ""
            echo "Either no semver release tag was provided, or neither NPM_TOKEN nor trusted publishing is enabled, so the workflow only produced tarballs and release artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload assets to GitHub release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/packages/*.tgz dist/answerlens-demo-audit.tar.gz dist/answerlens-site.tar.gz dist/release-assets-manifest.json dist/release-assets-summary.md --clobber
      - name: Refresh Pages release metadata
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          {
            echo "## Pages refresh requested"
            echo ""
            echo "Dispatched the Pages workflow on main so the live site can read the newly published release metadata."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: answerlens-release-distribution
          path: |
            dist/packages
            dist/answerlens-demo-audit.tar.gz
            dist/answerlens-site.tar.gz
            dist/release-assets-manifest.json
            dist/release-assets-summary.md
            dist/release-assets-smoke-summary.md
            dist/site
