name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm public:check
      - name: Check release snapshot (release PR)
        if: github.event_name == 'pull_request'
        run: pnpm release:snapshot:check -- --allow-planned-latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check release snapshot (main)
        if: github.event_name != 'pull_request'
        run: pnpm release:snapshot:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm demo:fixture
      - run: pnpm demo:consumer-repo
      - run: pnpm build:admin
      - run: pnpm build:site
      - run: pnpm seo:check
      - run: pnpm pack:cli:dry-run
      - uses: actions/upload-artifact@v6
        with:
          name: answerlens-demo-runs
          path: |
            runs/static-good
            runs/consumer-repo
            !runs/**/raw/**
