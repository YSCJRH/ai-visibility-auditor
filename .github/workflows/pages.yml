name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: answerlens
        uses: ./
        with:
          command: audit
          site: examples/fixtures/static-good
          brand: examples/acme/brand.yaml
          competitors: examples/acme/competitors.yaml
          prompts: examples/acme/prompts.yaml
          out-dir: runs/static-good
      - id: consumer-repo
        uses: ./
        with:
          command: audit
          site: examples/fixtures/static-good
          brand: examples/consumer-repo/.github/answerlens/brand.yaml
          competitors: examples/consumer-repo/.github/answerlens/competitors.yaml
          prompts: examples/consumer-repo/.github/answerlens/prompts.yaml
          out-dir: runs/consumer-repo
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require("node:fs");
            fs.mkdirSync("dist", { recursive: true });
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const compiled = releases.map((release) => ({
              tag_name: release.tag_name,
              name: release.name,
              html_url: release.html_url,
              published_at: release.published_at,
              body: release.body,
              draft: release.draft,
              prerelease: release.prerelease
            }));
            fs.writeFileSync("dist/releases.json", `${JSON.stringify(compiled, null, 2)}\n`);
      - name: Prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm public:check
      - run: pnpm build:site -- --releases dist/releases.json
      - run: pnpm seo:check --releases dist/releases.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    if: ${{ vars.ANSWERLENS_ENABLE_PAGES_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Prepare pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - name: Smoke check live Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: pnpm pages:smoke -- --site-url "$PAGE_URL"
