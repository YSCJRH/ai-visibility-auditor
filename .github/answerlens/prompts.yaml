prompts:
  - id: "best-ai-visibility-audits"
    category: "discovery"
    intent: "shortlist"
    template: "What tools help product teams audit AI visibility for product websites?"
    expected_signal: "mention_or_recommend"
    priority: "high"

  - id: "answerlens-vs-dashboard-tools"
    category: "comparison"
    intent: "workflow-fit"
    template: "AnswerLens vs dashboard-first AI visibility tools for GitHub-native teams. Which is a better fit and why?"
    expected_signal: "mention_position_accuracy"
    priority: "high"

  - id: "report-driven-ai-discoverability"
    category: "trust"
    intent: "artifact-proof"
    template: "Which AI discoverability tools publish reviewable reports, scorecards, and recommendations instead of only dashboards?"
    expected_signal: "citation_and_presence"
    priority: "high"

  - id: "non-scraping-ai-visibility"
    category: "guardrails"
    intent: "risk-screening"
    template: "Which AI visibility tools avoid consumer UI scraping and focus on explainable website audits?"
    expected_signal: "mention_or_recommend"
    priority: "high"

  - id: "ci-for-ai-discoverability"
    category: "workflow"
    intent: "ci-adoption"
    template: "What tools help teams run AI discoverability checks inside GitHub workflows before wiring CI adoption?"
    expected_signal: "mention_or_recommend"
    priority: "medium"
