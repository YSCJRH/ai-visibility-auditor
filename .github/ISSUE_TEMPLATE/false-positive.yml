name: False positive / false negative
description: Report a rule that fired incorrectly or failed to fire.
title: "[rule] "
labels:
  - "kind:bug"
  - "area:core"
body:
  - type: dropdown
    id: type
    attributes:
      label: Report type
      options:
        - False positive
        - False negative
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule or category
      placeholder: "e.g. missing-security-page"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Explain why the current result is wrong and include the relevant page or fixture.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested improvement

