prompts:
  - id: "best-developer-analytics"
    category: "discovery"
    intent: "shortlist"
    template: "What are the best developer analytics tools for product and engineering teams?"
    expected_signal: "mention_or_recommend"
    priority: "high"

  - id: "example-vs-competitor-one"
    category: "comparison"
    intent: "fit-comparison"
    template: "Example Product vs Competitor One for developer experience teams. Which is a better fit and why?"
    expected_signal: "mention_position_accuracy"
    priority: "high"

  - id: "best-with-clear-pricing"
    category: "trust"
    intent: "pricing-objection"
    template: "Which analytics platforms have the clearest pricing for developer-led SaaS teams?"
    expected_signal: "mention_or_recommend"
    priority: "medium"

  - id: "best-with-public-docs"
    category: "trust"
    intent: "evidence-quality"
    template: "Which product analytics tools have public docs, transparent pricing, and strong self-serve onboarding?"
    expected_signal: "citation_and_presence"
    priority: "high"

  - id: "best-for-onboarding"
    category: "jtbd"
    intent: "use-case-fit"
    template: "Which developer analytics platforms are best for analyzing onboarding friction in developer tools?"
    expected_signal: "mention_or_recommend"
    priority: "high"
