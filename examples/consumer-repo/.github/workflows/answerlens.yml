name: AnswerLens

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Keep eval defaults in .github/answerlens/runtime.yaml.
      # Only add provider/model overrides here when you want a temporary change.
      - id: answerlens
        uses: YSCJRH/ai-visibility-auditor@v0.3.6
        with:
          command: audit
          site: https://www.example.com
          brand: .github/answerlens/brand.yaml
          competitors: .github/answerlens/competitors.yaml
          prompts: .github/answerlens/prompts.yaml
          out-dir: runs/answerlens

      - name: Publish AnswerLens summary
        shell: bash
        run: |
          cat "${{ steps.answerlens.outputs.share-summary-path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifact review order" >> "$GITHUB_STEP_SUMMARY"
          echo "1. \`${{ steps.answerlens.outputs.share-summary-path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "2. \`${{ steps.answerlens.outputs.scorecard-path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "3. \`${{ steps.answerlens.outputs.recommendations-path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### PR-ready snippet" >> "$GITHUB_STEP_SUMMARY"
          cat "${{ steps.answerlens.outputs.pr-snippet-path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### run.json" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.answerlens.outputs.run-json-path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Adopter kit" >> "$GITHUB_STEP_SUMMARY"
          echo "- To reuse this setup, copy \`.github/answerlens/\` and \`.github/workflows/answerlens.yml\`, then replace the brand, competitors, prompts, and \`site:\` URL." >> "$GITHUB_STEP_SUMMARY"
          echo "- Keep non-secret eval defaults in \`runtime.yaml\`; put provider keys in GitHub secrets or local environment variables." >> "$GITHUB_STEP_SUMMARY"
          echo "- Review \`share-summary.md\`, then \`scorecard.md\`, then \`recommendations.md\` before pasting \`pr-snippet.md\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Safe sharing boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public PRs should link the summary, scorecard, and recommendations; \`raw/**\` is excluded from the uploaded artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "- AnswerLens audits public source material. No consumer AI UI scraping. No ranking or answer-placement guarantee." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Share this first run" >> "$GITHUB_STEP_SUMMARY"
          echo "- If this run is safe and authorized to discuss, use the [first-run story template](https://github.com/YSCJRH/ai-visibility-auditor/blob/main/docs/first-run-story.md) and [Show and tell Discussion form](https://github.com/YSCJRH/ai-visibility-auditor/discussions/new?category=show-and-tell)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Do not include API keys, private analytics, or raw provider payloads." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: answerlens-report
          path: |
            ${{ steps.answerlens.outputs.out-dir }}
            !${{ steps.answerlens.outputs.out-dir }}/raw/**
