# Default fixture-demo eval baseline.
# Keep this file lightweight for first runs; use profile aliases such as
# high-confidence-review or perplexity-cross-check only when you need a temporary re-check.
runtime:
  eval:
    provider: openai
    model: gpt-5-mini
    locale: en-US
    samples: 1
    timeout_ms: 60000

  providers:
    openai:
      base_url: https://api.openai.com/v1
    perplexity:
      base_url: https://api.perplexity.ai
